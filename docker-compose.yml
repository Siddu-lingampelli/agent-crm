# docker-compose.yml - Production deployment with Docker Compose

version: '3.8'

services:
  crm:
    image: crm:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_ID: ${BUILD_ID:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: crm-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Database
      - CRM_DATABASE_PATH=/app/data/crm.db
      - CRM_DATABASE_MAX_OPEN_CONNS=10
      - CRM_DATABASE_MAX_IDLE_CONNS=5
      - CRM_DATABASE_BUSY_TIMEOUT=5s

      # HTTP Server
      - CRM_HTTP_HOST=0.0.0.0
      - CRM_HTTP_PORT=8080
      - CRM_HTTP_READ_TIMEOUT=15s
      - CRM_HTTP_WRITE_TIMEOUT=30s
      - CRM_HTTP_IDLE_TIMEOUT=60s
      - CRM_HTTP_SHUTDOWN_TIMEOUT=10s

      # Logging
      - CRM_LOG_FORMAT=json
      - CRM_LOG_LEVEL=info

      # Server Info
      - CRM_SERVER_VERSION=${VERSION:-dev}
      - CRM_BUILD_ID=${BUILD_ID:-unknown}
      - CRM_GIT_SHA=${GIT_SHA:-unknown}
      - CRM_ENV=production

      # Jobs
      - CRM_JOBS_WORKERS=8
      - CRM_JOBS_QUEUE_SIZE=256

      # Security
      - CRM_SECURITY_RATE_LIMIT_ENABLED=true
      - CRM_SECURITY_RATE_LIMIT_RPS=100
      - CRM_SECURITY_RATE_LIMIT_BURST=200
      - CRM_SECURITY_MAX_REQUEST_BODY=10485760
      - CRM_SECURITY_MAX_UPLOAD_SIZE=52428800
      - CRM_SECURITY_CORS_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
      - CRM_SECURITY_CORS_CREDENTIALS=true
      - CRM_SECURITY_SSRF_BLOCK_PRIVATE=true
      - CRM_SECURITY_REQUEST_TIMEOUT=30s
      - CRM_SECURITY_HTTP_CLIENT_TIMEOUT=30s
      - CRM_SECURITY_HTTP_CLIENT_MAX_RESPONSE=10485760
      - CRM_SECURITY_IDEMPOTENCY_TTL=24h
      - CRM_SECURITY_AUDIT_MAX_SIZE=1048576
      - CRM_SECURITY_AUDIT_MAX_ENTRIES=10000
      - CRM_SECURITY_SESSION_COOKIE_NAME=crm_session
      - CRM_SECURITY_SESSION_COOKIE_SECURE=true
      - CRM_SECURITY_SESSION_COOKIE_SAMESITE=Lax
      - CRM_SECURITY_SESSION_MAX_AGE=24h
      - CRM_SECURITY_CSRF_ENABLED=true
      - CRM_SECURITY_CSRF_HEADER=X-CSRF-Token
      - CRM_SECURITY_CSRF_COOKIE=csrf_token
      - CRM_SECURITY_CSRF_TOKEN_LENGTH=32

      # Owner bootstrap (set these before first run)
      - CRM_OWNER_EMAIL=${CRM_OWNER_EMAIL:-}
      - CRM_OWNER_PASSWORD=${CRM_OWNER_PASSWORD:-}

      # Encryption key for integration credentials (generate with: openssl rand -hex 32)
      - CRM_ENCRYPTION_KEY=${CRM_ENCRYPTION_KEY:-}

      # Memory
      - GOMEMLIMIT=400MiB

    volumes:
      - crm-data:/app/data
      - crm-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    networks:
      - crm-network

  # Reverse proxy with TLS termination
  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - crm
    networks:
      - crm-network

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: crm-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - crm-network
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: crm-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set a strong GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - crm-network
    profiles:
      - monitoring

  # Optional: Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: crm-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - crm-network
    profiles:
      - monitoring

  # Optional: Promtail for log shipping
  promtail:
    image: grafana/promtail:latest
    container_name: crm-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - crm-logs:/app/logs:ro
    networks:
      - crm-network
    profiles:
      - monitoring

volumes:
  crm-data:
    driver: local
  crm-logs:
    driver: local
  nginx-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  crm-network:
    driver: bridge