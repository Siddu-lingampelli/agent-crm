# Promtail ships the CRM container logs (mounted at /app/logs) to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: crm-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: crm
          __path__: /app/logs/*.log
